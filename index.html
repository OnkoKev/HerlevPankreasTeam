<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pankreas Bivirkningsapp</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(92%, 520px);
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 2rem;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #4b5563;
    }

    .download-btn {
      display: block;
      margin-top: 28px;
      padding: 18px 24px;
      background: #0b5cab;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .download-btn:hover {
      background: #084a8a;
    }

    .small {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <main class="card">
    <h1>Pankreas Bivirkningsapp</h1>

    <p>
      Hent appen til din telefon for at registrere bivirkninger under din behandling.
    </p>

    <a
      class="download-btn"
      href="PankreasBivirkningsApp.v.1.html"
      download="PankreasBivirkningsApp.v.1.html">
      Hent bivirkningsappen
    </a>

    <p class="small">
      Filen gemmes på din telefon og kan derefter åbnes i din browser.
    </p>
  </main>

</body>
</html>
